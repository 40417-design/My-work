<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flower Shop</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    background-color: #fff0f5;
}

header {
    background-color: #ff69b4;
    color: white;
    padding: 15px;
    text-align: center;
}

.container {
    padding: 20px;
}

.product {
    background: white;
    padding: 15px;
    margin: 10px 0;
    border-radius: 10px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}

button {
    background-color: #ff69b4;
    color: white;
    border: none;
    padding: 8px 15px;
    border-radius: 5px;
    cursor: pointer;
}

button:hover {
    background-color: #ff1493;
}

.cart {
    margin-top: 20px;
    background: #fff;
    padding: 15px;
    border-radius: 10px;
}
</style>
</head>

<body>

<header>
    <h1>🌸 ร้านขายดอกไม้สด</h1>
</header>

<div class="container">

    <div class="product">
        <h3>ดอกกุหลาบ</h3>
        <p>ราคา 50 บาท</p>
        <button onclick="addToCart('ดอกกุหลาบ',50)">สั่งซื้อ</button>
    </div>

    <div class="product">
        <h3>ดอกทิวลิป</h3>
        <p>ราคา 70 บาท</p>
        <button onclick="addToCart('ดอกทิวลิป',70)">สั่งซื้อ</button>
    </div>

    <div class="product">
        <h3>ดอกลิลลี่</h3>
        <p>ราคา 80 บาท</p>
        <button onclick="addToCart('ดอกลิลลี่',80)">สั่งซื้อ</button>
    </div>

    <div class="cart">
        <h2>🛒 ตะกร้าสินค้า</h2>
        <ul id="cart-list"></ul>
        <h3>ยอดรวม: <span id="total">0</span> บาท</h3>
    </div>

</div>

<script>
let total = 0;

function addToCart(name, price) {
    const cartList = document.getElementById("cart-list");
    const li = document.createElement("li");
    li.textContent = name + " - " + price + " บาท";
    cartList.appendChild(li);

    total += price;
    document.getElementById("total").textContent = total;
}
</script>

</body>
</html>
