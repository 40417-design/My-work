<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Simple Code Editor</title>
    <style>
        body { font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        .header { background: #333; color: white; padding: 10px 20px; text-align: center; }
        .container { display: flex; flex: 1; border-top: 1px solid #ccc; }
        textarea, iframe { width: 50%; height: 100%; border: none; padding: 15px; box-sizing: border-box; font-size: 16px; }
        textarea { background: #282c34; color: #abb2bf; font-family: 'Courier New', Courier, monospace; resize: none; outline: none; }
        iframe { background: white; }
    </style>
</head>
<body>

<div class="header">
    <h2>HTML Code Editor (Real-time)</h2>
</div>

<div class="container">
    <textarea id="html-code" placeholder="เขียนโค้ด HTML ที่นี่..." oninput="runCode()"><h1>สวัสดีชาวโลก!</h1>
<p>ลองแก้โค้ดที่ฝั่งซ้ายดูนะครับ</p></textarea>

    <iframe id="output"></iframe>
</div>

<script>
    function runCode() {
        let htmlCode = document.getElementById("html-code").value;
        let output = document.getElementById("output").contentWindow.document;

        output.open();
        output.write(htmlCode);
        output.close();
    }
    
    // เรียกใช้ครั้งแรกตอนโหลดหน้าเว็บ
    window.onload = runCode;
</script>

</body>
</html>
