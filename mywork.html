<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>เว็บไซต์ของฉัน</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f8ff;
            margin: 0;
            padding: 0;
            text-align: center;
        }
        header {
            background-color: #4CAF50;
            color: white;
            padding: 20px;
        }
        nav {
            background-color: #333;
            padding: 10px;
        }
        nav a {
            color: white;
            margin: 0 15px;
            text-decoration: none;
        }
        nav a:hover {
            color: yellow;
        }
        section {
            padding: 20px;
        }
        footer {
            background-color: #4CAF50;
            color: white;
            padding: 10px;
            position: fixed;
            width: 100%;
            bottom: 0;
        }
    </style>
</head>
<body>

    <header>
        <h1>ยินดีต้อนรับสู่เว็บไซต์ของฉัน</h1>
        <p>เว็บไซต์ที่สร้างด้วย HTML</p>
    </header>

    <nav>
        <a href="#">หน้าแรก</a>
        <a href="#">เกี่ยวกับ</a>
        <a href="#">ผลงาน</a>
        <a href="#">ติดต่อ</a>
    </nav>

    <section>
        <h2>เกี่ยวกับฉัน</h2>
        <p>สวัสดีค่ะ นี่คือเว็บไซต์แรกที่ฉันสร้างเอง 🎉</p>
        <button onclick="alert('ขอบคุณที่กดปุ่ม!')">กดที่นี่</button>
    </section>

    <footer>
        <p>© 2026 เว็บไซต์ของฉัน</p>
    </footer>

</body>
</html>
